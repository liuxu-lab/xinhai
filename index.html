<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三城排查台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:#f7f2e8}
body{margin:0;height:100vh;min-height:100vh;background:#f7f2e8;color:#221f1a;
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;
  border-bottom:2px solid #e3d8c6;flex:0 0 auto}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid #8b2f24;flex:0 0 auto;background:#eee}
.av img{width:100%;height:100%;object-fit:cover}
.tt{flex:1;min-width:0}
.nm{font-size:22px;font-weight:700;color:#8b2f24;line-height:1.2;letter-spacing:1px}
.sub{font-size:13px;color:#7d7263;margin-top:2px}
.st{font-size:12.5px;padding:4px 10px;border-radius:10px;background:#f1e8d8;color:#6f6250;white-space:nowrap}
.st.on{background:#e4f0dd;color:#3d6a33}
.tabs{display:flex;gap:10px;padding:12px 18px 6px;flex:0 0 auto}
.tab{flex:1;background:#fff;border:1px solid #ddd1bd;border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;transition:.15s}
.tab:hover{transform:translateY(-1px)}
.tab .cn{font-size:20px;font-weight:700;color:#4a443a}
.tab .cs{font-size:12.5px;color:#8a7f6e;margin-top:2px}
.tab.on{border-color:#8b2f24;background:#fdf6f2;box-shadow:0 3px 12px rgba(139,47,36,.12)}
.tab.on .cn{color:#8b2f24}
.main{flex:1;display:flex;gap:14px;padding:8px 18px 0;min-height:0}
.left{flex:1.25;display:flex;flex-direction:column;min-width:0;background:#fff;border-radius:14px;border:1px solid #e6dbc9;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #f0e7d8;font-size:14px;color:#7d7263;font-weight:700}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:12px;font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.ai{align-self:flex-start;background:#f4ede0;border-left:4px solid #8b2f24}
.me{align-self:flex-end;background:#8b2f24;color:#fdf1e6}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d9a79b;
  color:#8b2f24;font-size:14px;padding:7px 12px;border-radius:20px;cursor:pointer;font-weight:700}
.chip:hover{background:#fdf3ef}
.bar{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid #f0e7d8}
input{flex:1;font-size:16px;padding:11px 13px;border:1px solid #d8ccb8;border-radius:10px;background:#fff;outline:none;font-family:inherit;min-width:0}
input:focus{border-color:#8b2f24}
button{font-size:15px;padding:0 18px;border-radius:10px;border:none;background:#8b2f24;color:#fff;font-family:inherit;cursor:pointer;white-space:nowrap}
button.ghost{background:#fff;color:#6f6250;border:1px solid #d8ccb8}
.right{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;border-radius:14px;border:1px solid #e6dbc9;overflow:hidden}
.cards{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.card{border:1px solid #e6dbc9;border-radius:11px;padding:10px 12px;cursor:pointer;background:#fffdf9;transition:.15s}
.card:hover{border-color:#d9a79b;box-shadow:0 3px 10px rgba(139,47,36,.08)}
.card .cat{display:inline-block;font-size:11.5px;background:#f1e4da;color:#8b2f24;padding:2px 7px;border-radius:5px;font-weight:700}
.card .t{font-size:16px;font-weight:700;margin-top:6px;color:#2c2822;line-height:1.4}
.card .h{font-size:13px;color:#8a7f6e;margin-top:4px;line-height:1.5}
.foot{padding:10px 18px 14px;flex:0 0 auto}
.foot button{width:100%;padding:13px 0;font-size:17px;font-weight:700;letter-spacing:1px}
/* 弹层 */
.modal{position:fixed;inset:0;background:rgba(30,24,18,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:860px;max-height:90%;overflow:auto;position:relative}
.mhd{position:sticky;top:0;background:#fff;padding:14px 18px;border-bottom:1px solid #eee3d4;display:flex;align-items:center;gap:10px;z-index:2}
.mhd .mcat{font-size:12px;background:#efe2d6;color:#8b2f24;padding:3px 9px;border-radius:6px;font-weight:700}
.mhd .mt{font-size:19px;font-weight:700;color:#2c2822;flex:1}
.x{width:34px;height:34px;border-radius:50%;background:#f2ece2;color:#6f6250;display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;border:none;padding:0}
.x:hover{background:#e8dfd0}
.mbody{display:flex;gap:16px;padding:16px 18px 20px;flex-wrap:wrap}
.mimg{flex:1 1 300px;min-width:260px}
.mimg img{width:100%;max-height:430px;object-fit:contain;background:#faf7f0;border-radius:10px;border:1px solid #eee3d4;cursor:zoom-in;display:block}
.mtext{flex:1 1 340px;min-width:260px}
.quote{background:#faf5ec;border-left:4px solid #8b2f24;padding:12px 14px;border-radius:8px;font-size:15.5px;line-height:1.8;color:#3a352d;font-family:"SimSun","Songti SC",serif}
.quote .src{display:block;margin-top:8px;font-size:12.5px;color:#8a7f6e;font-family:"Microsoft YaHei",sans-serif;text-align:right}
.pts{margin-top:14px;padding:0;list-style:none}
.pts li{position:relative;padding-left:20px;font-size:15.5px;line-height:1.75;color:#3a352d;margin-bottom:7px}
.pts li:before{content:"";position:absolute;left:4px;top:10px;width:7px;height:7px;border-radius:50%;background:#b8862f}
/* 灯箱 */
.lightbox{position:fixed;inset:0;background:rgba(12,10,8,.92);display:none;align-items:center;justify-content:center;z-index:60;padding:30px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb-x{position:absolute;top:16px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);
  color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.lb-x:hover{background:rgba(255,255,255,.26)}
/* 评估 */
.eval{max-width:620px}
.step{font-size:15.5px;color:#5d5445;background:#f7efe2;border-radius:8px;padding:8px 12px}
.rline{display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:10px;font-size:16px;line-height:2.1;color:#2c2822;cursor:pointer}
.rline .rtxt{flex:1;text-align:left}
.rline input{flex:0 0 19px;width:19px;height:19px;margin:0}
.resbody{margin-top:16px}
.resbody .verdict{font-size:16px;color:#8b2f24}
.resbody .good{font-size:15px;color:#3d6a33}
.resbody .warn{font-size:15px;color:#a33}
.resbody .olist{margin:6px 0 0 18px;padding:0;font-size:14.5px;color:#7a4a45;line-height:1.7}
.refbox{margin-top:14px;background:#faf5ec;border-left:4px solid #b8862f;border-radius:8px;padding:12px 14px}
.reft{font-size:14px;font-weight:700;color:#b8862f;margin-bottom:6px}
.refbox p{margin:6px 0;font-size:14.5px;line-height:1.75;color:#3a352d}
.refbox .tail{color:#8b2f24;font-weight:700}
.eval .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eee3d4}
.eval .row .lab{flex:1;font-size:16px;color:#3a352d}
.eval .seg{display:flex;gap:6px}
.eval .seg span{font-size:14.5px;padding:6px 14px;border:1px solid #d8ccb8;border-radius:8px;color:#6f6250;cursor:pointer;background:#fff}
.eval .seg span.on{background:#8b2f24;color:#fff;border-color:#8b2f24}
.eval .cty{display:flex;gap:6px;margin-bottom:8px}
.eval .cty b{font-size:14px;padding:6px 12px;border-radius:8px;background:#f4ede0;cursor:pointer;color:#6f6250}
.eval .cty b.on{background:#8b2f24;color:#fff}
.res p{font-size:15.5px;line-height:1.75;margin:8px 0;color:#3a352d}
.res .ok{color:#3d6a33;font-weight:700}.res .no{color:#a33;font-weight:700}
@media (max-width:900px){
  body{display:block;height:auto;min-height:100vh}
  .main{display:block;padding:8px 12px 0}
  .left{height:340px;margin-bottom:10px}
  .right{height:300px}
  .foot{position:sticky;bottom:0;background:#f7f2e8;padding:10px 12px 14px}
  .nm{font-size:18px}.tab .cn{font-size:16px}
  .msg{font-size:15px}
  .card .t{font-size:15px}
}
</style>
</head>

    <div class="nm">张之洞 · 数字分身</div>
    <div class="sub">三城排查：为什么是武昌？</div>
  </div>
  <button id="viewSubs" style="font-size:13px;padding:8px 14px;border-radius:10px;background:#fff;color:#8B2F24;border:1px solid #D9A79B;cursor:pointer;font-family:inherit;white-space:nowrap">👁 学生完成情况</button>
  <div class="st" id="st">连接中…</div>
</div>

<div class="tabs" id="tabs"></div>

<div class="main">
  <div class="left">
    <div class="panel-h"><span>问张之洞</span><span id="hint" style="font-weight:400;font-size:12.5px">问到关键词，会给你卡片</span></div>
    <div class="chat" id="chat"></div>
    <div class="bar">
      <input id="q" placeholder="问张之洞……（如：铁路通到哪）" autocomplete="off">
      <button id="send">问</button>
    </div>
  </div>

  <div class="right">
    <div class="panel-h"><span>知识卡片</span><span id="cardCount" style="font-weight:400;font-size:12.5px"></span></div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div class="foot"><button id="openEval">做出判断 · 为什么是武昌</button></div>

<!-- 卡片弹层 -->
<div class="modal" id="cardModal">
  <div class="mbox">
    <div class="mhd">
      <span class="mcat" id="mCat"></span>
      <span class="mt" id="mTitle"></span>
      <button class="x" onclick="closeCard()">×</button>
    </div>
    <div class="mbody">
      <div class="mimg" id="mImgBox"><img id="mImg" onclick="openLightbox(this.src)" alt=""></div>
      <div class="mtext">
        <div class="quote"><span id="mQuote"></span><span class="src" id="mSrc"></span></div>
        <ul class="pts" id="mPts"></ul>
      </div>
    </div>
  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-x" onclick="closeLightbox()">×</button>
  <img id="lbImg" alt="">
</div>

<!-- 判断弹层 -->
<div class="modal" id="evalModal">
  <div class="mbox eval">
    <div class="mhd">
      <span class="mt">判断：起义最可能发生在哪座城？</span>
      <button class="x" onclick="closeEval()">×</button>
    </div>
    <div style="padding:16px 20px 22px">
      <div class="step">第一步　从下面勾选 <b>两条以上</b> 你认为「有利于起义」的条件</div>
      <div id="reasonList"></div>
      <div class="step" style="margin-top:18px">第二步　起义最可能发生在——</div>
      <div class="cty" id="cityPick"></div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button style="flex:2;padding:13px 0;font-size:16px" onclick="submitJudge()">提交判断</button>
        <button class="ghost" style="flex:1" onclick="closeEval()">取消</button>
      </div>
      <div class="res" id="resBox"></div>
    </div>
  </div>
</div>

<div class="modal" id="subsModal">
  <div class="mbox" style="max-width:880px">
    <div class="mhd">
      <span class="mt">学生完成情况</span>
      <button onclick="clearSubs()" style="margin-left:auto;margin-right:12px;font-size:13px;padding:6px 12px;border-radius:8px;background:#fff;color:#8B2F24;border:1px solid #D9A79B;cursor:pointer;font-family:inherit">清空显示</button>
      <button class="x" onclick="closeSubs()">×</button>
    </div>
    <div style="padding:14px 18px 20px">
      <div id="subsSum" style="font-size:15px;color:#7d7263;margin-bottom:12px">连接中…</div>
      <div id="subsList" style="max-height:62vh;overflow:auto"></div>
    </div>
  </div>
</div>

const PRESET_QA = {"wuchang": [{"k": ["铁路", "交通", "通衢", "京汉"], "a": "京汉铁路光绪三十二年通车，北抵卢沟桥；长江上下，汉口当其中。兵可朝发夕至，此谓通衢。"}, {"k": ["铁厂", "工业", "钢铁", "工厂", "汉阳造", "枪炮"], "a": "汉阳铁厂光绪二十年出铁，中国第一家近代钢铁企业；又有枪炮厂、织布局。武汉自此有了工业底子，不只做买卖。"}, {"k": ["新军", "兵", "军队", "招兵", "秀才", "读书人", "识字"], "a": "湖北新军编成一镇一协，官兵一万六千余人，仅次北洋。招兵取十八至二十四岁、略通文理者，黄陂九十六人中，禀生十二、秀才二十四。"}, {"k": ["书院", "学堂", "教育", "两湖", "自强"], "a": "两湖书院收两湖士子，经史之外兼授算学、格致、舆图；又设自强学堂。读书人不只读经了。"}, {"k": ["控制", "官府", "督抚", "保路", "空虚", "弹压"], "a": "我离鄂之后，地方之事渐失主持。保路风潮一起，新军调入川，武汉便空了。"}, {"k": ["位置", "九省", "地理"], "a": "汉口为通商口岸，长江东西、铁路南北，九省通衢，非虚言也。"}, {"k": ["租界", "洋人", "列强", "兵舰"], "a": "汉口亦有五国租界，然合计不过二点二平方公里，又与武昌隔江。上海则租界即城，兵舰环泊——不可比也。"}], "shanghai": [{"k": ["面积", "体量", "平方公里", "多大", "亩"], "a": "上海公共租界二十余平方公里，汉口五国租界合起来不过二点二平方公里——十倍之差。租界是一整座城，还是一条约江的街，岂可同日而语？"}, {"k": ["租界", "洋人", "列强", "外国", "兵舰", "干涉"], "a": "据我所知，上海租界即城，各国兵舰常泊黄浦江，又有万国商团。一动则各国必问，交涉最是棘手。"}, {"k": ["通商", "商务", "商人", "开埠", "交通"], "a": "上海为通商总汇，咸丰八年以后日盛。然其利在商货往来，不在调兵。"}, {"k": ["制造局", "工业", "工厂", "枪炮"], "a": "江南制造总局在同治四年设立，造枪炮弹药；然是官办军械之局，非野战新军驻地。"}, {"k": ["新军", "兵", "军队"], "a": "上海非练兵之地。我练新军，在江宁、在武昌，不在上海。"}, {"k": ["控制", "官府", "知县"], "a": "上海县城尚归清廷管辖，然租界之内，政令不行。"}], "beijing": [{"k": ["朝廷", "京师", "控制", "禁军", "八旗"], "a": "京师乃朝廷所在，禁旅八旗驻守，步军统领、九门提督层层节制。外臣于彼处之事，不敢多言。"}, {"k": ["六镇", "北洋", "兵", "军队", "新军"], "a": "北洋六镇拱卫近畿，器械精良，兵权集于袁世凯一系。我且问你：此处一动，四方兵可立至，岂是容易之地？"}, {"k": ["使馆", "东交民巷", "洋人", "列强", "驻兵"], "a": "东交民巷为使馆界，庚子以后各国驻兵。京师一动，各国立即过问。"}, {"k": ["铁路", "交通", "京汉"], "a": "京汉铁路北端即在卢沟桥，一昼夜可通汉口。交通虽便，于京师却是兵可速至。"}, {"k": ["暗杀", "吴樾", "汪精卫", "刺杀"], "a": "我亦风闻有人行刺之事，然京师查禁甚严，事多不成。"}], "all": [{"k": ["革命", "起义", "1911", "民国", "孙中山", "同盟会"], "a": "此皆我身后之事，无从知晓。诸君若问我任内所为，我可以一一奉告。"}, {"k": ["铁路好不好", "好事", "坏事"], "a": "铁路一通，货可速达，兵亦可速集，此其利；然路权、养路之费甚巨，洋人觊觎亦堪忧。利大而弊随，岂能只见一端？"}, {"k": ["你是谁", "何人", "介绍"], "a": "鄙人张之洞，字孝达，号香涛，直隶南皮人。现督湖广。"}, {"k": ["谢谢", "多谢", "受教"], "a": "不必谢。诸君能推得明白，便不负此问。"}, {"k": ["你好", "在吗", "您好"], "a": "后生有何见教？"}]};
const CITIES = {"wuchang": {"name": "武昌", "sub": "", "know": "我督湖广十余年，汉阳铁厂、枪炮厂、两湖书院、自强学堂、湖北新军，皆我所办。京汉铁路通京师，长江通上下游。此地之事，我知最详。"}, "shanghai": {"name": "上海", "sub": "", "know": "上海我只在署理两江时到过几次。据我所知，那是商务之地，洋人租界林立，各国兵舰常泊黄浦江。练兵、聚众，皆非其所宜。"}, "beijing": {"name": "北京", "sub": "", "know": "京师我入觐时去过。据我所知，那里禁旅森严，步军统领、九门提督层层节制。我为外臣，于彼处之事，不敢多言。"}};

  c.textContent = '📎 ' + card.cat + ' · ' + card.title + '　点开看';
  c.onclick = function(){ openCard(card.id); };
  chatEl.appendChild(c); chatEl.scrollTop = chatEl.scrollHeight;
}

function findCards(text){
  var out = [];
  (CARDS[city] || []).forEach(function(c){
    for (var i = 0; i < c.keys.length; i++){
      if (text.indexOf(c.keys[i]) >= 0){ out.push(c); return; }
    }
  });
  return out;
}

function switchCity(k){
  city = k;
  renderTabs(); renderCards();
  chatEl.innerHTML = '';
  bubble('ai', CITIES[k].know);
  (hist[k] || []).forEach(function(m){
    if (m.role === 'user') bubble('me', m.content);
    else if (m.content !== CITIES[k].know) bubble('ai', m.content);
  });
}

function openCard(id){
  var c = (CARDS[city] || []).filter(function(x){ return x.id === id; })[0];
  if (!c) return;
  document.getElementById('mCat').textContent = c.cat;
  document.getElementById('mTitle').textContent = c.title;
  document.getElementById('mQuote').textContent = c.quote ? c.quote.t : '';
  document.getElementById('mSrc').textContent = c.quote && c.quote.s ? '—— ' + c.quote.s : '';
  var ul = document.getElementById('mPts'); ul.innerHTML = '';
  (c.pts || []).forEach(function(t){ var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  var box = document.getElementById('mImgBox'), img = document.getElementById('mImg');
  if (c.img){
    img.src = c.img; img.style.display = 'block'; box.style.display = 'block';
  } else {
    img.style.display = 'none'; box.style.display = 'none';
  }
  cardModal.classList.add('on');
}
function closeCard(){ cardModal.classList.remove('on'); }
function openLightbox(src){ document.getElementById('lbImg').src = src; lightbox.classList.add('on'); }
function closeLightbox(){ lightbox.classList.remove('on'); }

document.getElementById('openEval').onclick = function(){
  renderJudge();
  document.getElementById('resBox').innerHTML = '';
  evalModal.classList.add('on');
};
function closeEval(){ evalModal.classList.remove('on'); }

var REASONS = [
  {id: 1, t: '铁路与长江在此交汇，调兵迅速', city: 'wuchang'},
  {id: 2, t: '有近代工厂，工业基础较好', city: 'wuchang'},
  {id: 3, t: '有新式陆军，且军中革命党人已做了大量动员', city: 'wuchang'},
  {id: 4, t: '有新式学堂，传播新思想、培养新式人才', city: 'wuchang'},
  {id: 5, t: '官府控制较松，地方官难以弹压', city: 'wuchang'},
  {id: 6, t: '租界林立，外国人随时可以干涉', city: 'shanghai'},
  {id: 7, t: '是朝廷所在，禁军云集', city: 'beijing'},
  {id: 8, t: '对外通商便利，商人云集', city: 'shanghai'}
];
var checkedReasons = {};
var pickCity = '';

function renderJudge(){
  var h = '';
  REASONS.forEach(function(r){
    h += '<label class="rline"><input type="checkbox" onchange="toggleReason(' + r.id + ',this.checked)" ' +
         (checkedReasons[r.id] ? 'checked ' : '') + '><span class="rtxt">' + r.t + '</span></label>';
  });
  document.getElementById('reasonList').innerHTML = h;

  var c = '';
  ['wuchang', 'shanghai', 'beijing'].forEach(function(k){
    c += '<b class="' + (pickCity === k ? 'on' : '') + '" onclick="pickJCity(\'' + k + '\')">' + CITIES[k].name + '</b>';
  });
  document.getElementById('cityPick').innerHTML = c;
}
function toggleReason(id, on){ checkedReasons[id] = on; }
function pickJCity(k){ pickCity = k; renderJudge(); }

var ROOM = 'xinhai1911-2026';
var VOTER = (function(){
  try{
    var v = localStorage.getItem('zzh_voter');
    if (!v){ v = 'v' + Math.random().toString(36).slice(2, 8); localStorage.setItem('zzh_voter', v); }
    return v;
  }catch(e){ return 'v' + Math.random().toString(36).slice(2, 8); }
})();
var mqttClient = null;

function addCastButton(cityKey, reasons){
  var box = document.createElement('div');
  box.style.marginTop = '14px';
  box.innerHTML = '<button id="castBtn" style="width:100%;padding:12px 0;font-size:16px">📤 提交给老师</button>' +
                  '<div id="castMsg" style="font-size:13px;color:#7a6a52;margin-top:8px;line-height:1.6"></div>';
  document.getElementById('resBox').appendChild(box);
  document.getElementById('castBtn').onclick = function(){ castVote(cityKey, reasons); };
}

function castVote(cityKey, reasons){
  var msg = document.getElementById('castMsg');
  if (typeof mqtt === 'undefined'){
    msg.textContent = '提交组件没加载出来（网络问题），请举手告诉老师。';
    return;
  }
  msg.textContent = '正在提交……';
  try{
    if (!mqttClient){
      mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {reconnectPeriod: 3000});
    }
    var payload = JSON.stringify({city: cityKey, reasons: reasons, voter: VOTER, t: Date.now()});
    mqttClient.publish('xinhai1911/' + ROOM + '/' + VOTER, payload, {retain: true, qos: 0}, function(err){
      msg.textContent = err ? '提交失败，请举手告诉老师。' : '✅ 已提交，老师那边能看到你的理由';
    });
  }catch(e){
    msg.textContent = '提交失败，请举手告诉老师。';
  }
}

function submitJudge(){
  var ids = Object.keys(checkedReasons).filter(function(i){ return checkedReasons[i]; }).map(Number);
  var h = '<div class="resbody">';
  if (ids.length < 2){
    h += '<p class="warn">至少勾选两条条件，理由才站得住。</p>';
  }
  if (!pickCity){
    h += '<p class="warn">还没有选城市。</p>';
    document.getElementById('resBox').innerHTML = h + '</div>';
    return;
  }
  var chosen = REASONS.filter(function(r){ return ids.indexOf(r.id) >= 0; });
  var same = chosen.filter(function(r){ return r.city === pickCity; });
  var other = chosen.filter(function(r){ return r.city !== pickCity; });

  h += '<p class="verdict">你的判断：<b>' + CITIES[pickCity].name + '</b>' +
       '　你勾了 ' + ids.length + ' 条条件</p>';

  if (same.length && !other.length){
    h += '<p class="good">你勾的每一条，说的都是' + CITIES[pickCity].name + '，判断与证据对得上。</p>';
  } else if (other.length && !same.length){
    h += '<p class="warn">你勾的条件说的都不是' + CITIES[pickCity].name + '。再看看卡片，或者改一下城市。</p>';
  } else if (other.length){
    h += '<p class="warn">有 ' + other.length + ' 条不是' + CITIES[pickCity].name + '的条件：</p><ul class="olist">';
    other.forEach(function(r){ h += '<li>' + r.t + '（说的是' + CITIES[r.city].name + '）</li>'; });
    h += '</ul>';
  } else {
    h += '<p class="good">理由与城市一致。</p>';
  }

  h += '<div class="refbox"><div class="reft">参考结论</div>' +
       '<p>三城之中，只有武昌同时具备：交通可聚、有厂有钱粮的底子、新军集中、学堂造就了新式读书人，而官府控制最松。</p>' +
       '<p>上海交通与商务都强，但租界当道、列强可随时干涉，是「力量够而动弹不得」；北京是朝廷心脏，禁军环伺，是「根本动不了」。</p>' +
       '<p class="tail">起义不是选出来的，是这些条件叠出来的。</p></div>';
  h += '</div>';
  document.getElementById('resBox').innerHTML = h;
  addCastButton(pickCity, chosen.map(function(r){ return r.t; }));
}

function presetMatch(k, text){
  var groups = [PRESET_QA[k] || [], PRESET_QA.all || []];
  for (var g = 0; g < groups.length; g++){
    var list = groups[g];
    for (var i = 0; i < list.length; i++){
      for (var j = 0; j < list[i].k.length; j++){
        if (text.indexOf(list[i].k[j]) >= 0) return list[i].a;
      }
    }
  }
  var cards = CARDS[k] || [];
  for (var m = 0; m < cards.length; m++){
    for (var n = 0; n < cards[m].keys.length; n++){
      if (text.indexOf(cards[m].keys[n]) >= 0){
        return '此事说来话长。' + (cards[m].pts && cards[m].pts[0] ? cards[m].pts[0] : '') + '你且看右边的卡片。';
      }
    }
  }
  return null;
}

async function send(){
  var text = q.value.trim(); if (!text) return;
  q.value = '';
  bubble('me', text);
  hist[city].push({role:'user', content: text});
  findCards(text).forEach(function(c){ addChip(c); });

  var preset = presetMatch(city, text);

  // 没钥匙、或明确离线：直接给预设，不等网络
  if (!KEY || navigator.onLine === false){
    bubble('ai', preset || '此刻网路不通，我一时答不上。诸君可先看右边的卡片，或换个问法。');
    hist[city].push({role:'assistant', content: preset || ''});
    chatEl.scrollTop = chatEl.scrollHeight;
    return;
  }

  var w = bubble('ai', '……');
  w.classList.add('wait');

  // 最多等 8 秒，超时就当断网处理
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 8000);

  try{
    var know = (CARDS[city] || []).map(function(c){
      return c.cat + '：' + (c.pts || []).join('；');
    }).join('\n');
    var sys = SYSTEM + "\n\n【你眼下谈的是" + CITIES[city].name + "，以下是你知道的事实】\n" + know;
    var msgs = [{role:'system', content: sys}].concat(hist[city].slice(-6));
    var opt = {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + KEY},
      body: JSON.stringify({model: MODEL, messages: msgs, temperature: 0.45, max_tokens: 200})
    };
    if (ctrl) opt.signal = ctrl.signal;
    var r = await fetch(API, opt);
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    var reply = (d.choices && d.choices[0] && d.choices[0].message.content || '').trim();
    w.classList.remove('wait');
    w.textContent = reply || '（他沉吟不语）';
    hist[city].push({role:'assistant', content: reply});
    findCards(reply).forEach(function(c){ addChip(c); });
  }catch(e){
    clearTimeout(timer);
    w.classList.remove('wait');
    if (preset){
      w.textContent = preset;
      hist[city].push({role:'assistant', content: preset});
      st.textContent = '预设答复'; st.className = 'st';
    } else {
      w.textContent = '此刻网路不通，我一时答不上。诸君可先看右边的卡片，或换个问法。';
    }
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

document.getElementById('send').onclick = send;
q.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ closeLightbox(); closeCard(); closeEval(); }
});

var subsClient = null, subsData = {};

function openSubs(){
  document.getElementById('subsModal').classList.add('on');
  ensureSubsClient();
  renderSubs();
}
function closeSubs(){ document.getElementById('subsModal').classList.remove('on'); }
function clearSubs(){ subsData = {}; renderSubs(); }

function ensureSubsClient(){
  if (subsClient || typeof mqtt === 'undefined') return;
  subsClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {reconnectPeriod: 3000});
  subsClient.on('connect', function(){
    subsClient.subscribe('xinhai1911/' + ROOM + '/#', {qos: 0});
    document.getElementById('subsSum').textContent = '已连接，等待学生提交…';
  });
  subsClient.on('message', function(topic, payload){
    try{
      var d = JSON.parse(payload.toString());
      if (d.voter) { subsData[d.voter] = d; renderSubs(); }
    }catch(e){}
  });
  subsClient.on('error', function(){
    document.getElementById('subsSum').textContent = '连接失败，请检查网络。';
  });
}

function renderSubs(){
  var arr = Object.keys(subsData).map(function(k){ return subsData[k]; })
              .sort(function(a,b){ return (b.t||0) - (a.t||0); });
  var cnt = {wuchang:0, shanghai:0, beijing:0};
  arr.forEach(function(d){ if (cnt[d.city] !== undefined) cnt[d.city]++; });
  var sum = '已提交 <b>' + arr.length + '</b> 人　·　武昌 ' + cnt.wuchang +
            '　上海 ' + cnt.shanghai + '　北京 ' + cnt.beijing;
  document.getElementById('subsSum').innerHTML = arr.length ? sum : '还没有人提交。学生做完判断后点「提交给老师」。';
  var box = document.getElementById('subsList');
  if (!arr.length){ box.innerHTML = ''; return; }
  box.innerHTML = arr.map(function(d){
    var tm = d.t ? new Date(d.t) : null;
    var hhmm = tm ? ('0' + tm.getHours()).slice(-2) + ':' + ('0' + tm.getMinutes()).slice(-2) : '';
    var rs = (d.reasons || []).map(function(r){ return '<li>' + r + '</li>'; }).join('');
    return '<div style="border:1px solid #E6DBC9;border-radius:10px;padding:11px 14px;margin-bottom:10px;background:#fffdf9">' +
           '<div style="font-size:15px;color:#2c2822;margin-bottom:6px"><b style="color:#8B2F24">' +
           (CITIES[d.city] ? CITIES[d.city].name : d.city) + '</b>' +
           '<span style="color:#a09585;font-size:12px;margin-left:10px">' + hhmm + '</span></div>' +
           '<ul style="margin:0;padding-left:20px;font-size:14.5px;line-height:1.8;color:#3a352d">' + rs + '</ul></div>';
  }).join('');
}

document.getElementById('viewSubs').onclick = openSubs;

renderTabs(); renderCards(); switchCity('wuchang');
try{

  var mq = location.search.match(/[?&]ask=([^&]+)/);
  if (mq){
    var qq = decodeURIComponent(mq[1]);
    setTimeout(function(){
      if (location.search.indexOf('preset=1') >= 0){
        var a = presetMatch(city, qq);
        bubble('me', qq);
        bubble('ai', a || '（预设里没有这条）');
        var chips = findCards(qq); chips.forEach(function(c){ addChip(c); });
      } else {
        q.value = qq; send();
      }
    }, 400);
  }
  var mc = location.search.match(/[?&]city=([a-z]+)/);
  if (mc && CITIES[mc[1]]){ switchCity(mc[1]); }
  var m = location.search.match(/[?&]card=([A-Za-z0-9]+)/);
  if (m){ setTimeout(function(){ openCard(m[1]); }, 300); }
  if (location.search.indexOf('lb=1') >= 0){ setTimeout(function(){ var i = document.getElementById('mImg'); if (i && i.src) openLightbox(i.src); }, 900); }
  if (location.search.indexOf('subs=1') >= 0){ setTimeout(openSubs, 500); }
  if (location.search.indexOf('eval=1') >= 0){
    setTimeout(function(){
      document.getElementById('openEval').click();
      if (location.search.indexOf('cmp=1') >= 0) showCompare();
      if (location.search.indexOf('judge=1') >= 0){ showJudge(); }
    }, 500);
  }
}catch(e){}
